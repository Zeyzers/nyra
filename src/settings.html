<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings - Nyra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/NyraLogo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <aside class="settings-nav" aria-label="Settings categories">
        <button class="settings-nav-item active" type="button" data-section="general"><span data-icon="home"></span>General</button>
        <button class="settings-nav-item" type="button" data-section="appearance"><span data-icon="spark"></span>Appearance</button>
        <button class="settings-nav-item" type="button" data-section="privacy"><span data-icon="shield"></span>Privacy & Security</button>
        <button class="settings-nav-item" type="button" data-section="search"><span data-icon="search"></span>Search</button>
        <button class="settings-nav-item" type="button" data-section="tabs"><span data-icon="layout"></span>Tabs</button>
        <button class="settings-nav-item" type="button" data-section="downloads"><span data-icon="download"></span>Downloads</button>
        <button class="settings-nav-item" type="button" data-section="shortcuts"><span data-icon="code"></span>Shortcuts</button>
        <button class="settings-nav-item" type="button" data-section="about"><span data-icon="info"></span>About Nyra</button>
      </aside>

      <section class="settings-card">
        <h1 id="section-title">General</h1>
        <p id="section-description" class="section-description"></p>
        <div id="settings-content"></div>
        <p id="status" role="status"></p>
      </section>
    </main>

    <script src="settings-utils.js"></script>
    <script src="icons.js"></script>
    <script>
      window.NyraIcons?.mount(document);
      const navItems = Array.from(document.querySelectorAll(".settings-nav-item"));
      const sectionTitle = document.getElementById("section-title");
      const sectionDescription = document.getElementById("section-description");
      const settingsContent = document.getElementById("settings-content");
      const status = document.getElementById("status");

      const SECTION_COPY = {
        general: ["General", "Core behavior for startup, navigation, zoom and saved state."],
        appearance: ["Appearance", "Theme, accent and density settings for the Nyra shell."],
        privacy: ["Privacy & Security", "Privacy defaults, local data controls and isolation details."],
        search: ["Search", "Choose the search provider used by the address bar and New Tab page."],
        tabs: ["Tabs", "Session restore, tab density and close button behavior."],
        downloads: ["Downloads", "Download location and save prompts."],
        shortcuts: ["Shortcuts", "Keyboard shortcuts currently supported by Nyra."],
        about: ["About Nyra", "App version, runtime details and project links."],
      };

      let settings = window.NyraSettings.DEFAULT_SETTINGS;
      let activeSection = localStorage.getItem("nyra-settings-section") || "general";
      let appInfo = null;
      let downloadsInfo = null;
      let permissions = [];
      let siteData = [];
      let updateInfo = null;
      let savedLoginsInfo = { available: true, logins: [] };
      let passwordSearch = "";
      const revealedPasswords = new Map();
      let pendingRevealId = "";

      function setStatus(message) {
        status.textContent = message;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function mergeSettings(nextSettings) {
        settings = window.NyraSettings.normalizeSettings(nextSettings);
        window.NyraSettings.applyAppearance(settings);
      }

      function row(label, description, control, asLabel = false) {
        const tag = asLabel ? "label" : "div";
        return `
          <${tag} class="setting-row">
            <span>
              <strong>${label}</strong>
              <small>${description}</small>
            </span>
            ${control}
          </${tag}>
        `;
      }

      function panel(rows) {
        return `<div class="settings-panel">${rows.join("")}</div>`;
      }

      function switchControl(id, checked) {
        return `
          <label class="switch">
            <input id="${id}" type="checkbox" ${checked ? "checked" : ""} />
            <span></span>
          </label>
        `;
      }

      function badge(text) {
        return `<span class="status-badge">${text}</span>`;
      }

      function selectControl(id, value, options) {
        return `
          <select id="${id}">
            ${options.map((option) => `
              <option value="${option.value}" ${option.value === value ? "selected" : ""}>${option.label}</option>
            `).join("")}
          </select>
        `;
      }

      async function saveSettings(partialSettings) {
        const nextSettings = await window.nyra.updateSettings(partialSettings);
        mergeSettings(nextSettings);
        renderSection(activeSection);
        setStatus("Saved.");
      }

      function renderGeneral() {
        return `
          ${panel([
            row("On startup", "Choose whether Nyra opens a fresh tab or restores saved tabs.", selectControl("startup-behavior", settings.startupBehavior, [
              { value: "newtab", label: "Open New Tab" },
              { value: "restore", label: "Restore previous session" },
            ]), true),
            row("New tab page", "Choose what opens for new tabs.", selectControl("newtab-page", settings.newTabPage, [
              { value: "start", label: "Nyra Start Page" },
              { value: "blank", label: "Blank Page" },
            ]), true),
            row("Default browser", "Open Windows default-app settings to choose Nyra manually.", `<button id="open-default-apps" class="inline-button" type="button">Open default apps</button>`),
            row("HTTPS-first navigation", "Bare domains open with https:// when enabled.", switchControl("https-first", settings.httpsFirst), true),
            row("Search engine", "Used by address bar and New Tab search.", selectControl("search-engine", settings.searchEngine, searchEngineOptions()), true),
            row("Interface language", "Nyra does not have an i18n system yet.", badge("English")),
            row("Default page zoom", "Applies to webviews and newly opened pages.", `
              <div class="zoom-control" aria-label="Zoom">
                <button id="zoom-out" type="button">-</button>
                <span>${Math.round(settings.defaultZoom * 100)}%</span>
                <button id="zoom-in" type="button">+</button>
              </div>
            `),
            row("Restore previous session", "Reopen saved tabs the next time Nyra starts.", switchControl("restore-session", settings.restoreSession), true),
            row("Hardware acceleration", "Use GPU acceleration when available. Restart Nyra to apply changes.", switchControl("hardware-acceleration", settings.hardwareAcceleration), true),
          ])}
          <button id="reset-state" type="button">Reset settings and saved state</button>
        `;
      }

      function renderAppearance() {
        return panel([
          row("Theme", "Choose Nyra's color mode.", selectControl("theme", settings.theme, [
            { value: "dark", label: "Dark" },
            { value: "light", label: "Light" },
            { value: "system", label: "System" },
          ]), true),
          row("Accent color", "Applies to active states, toggles and primary controls.", selectControl("accent-color", settings.accentColor, accentOptions()), true),
          row("Sidebar mode", "Choose full navigation labels or compact icon-only navigation.", selectControl("sidebar-mode", settings.sidebarMode, [
            { value: "expanded", label: "Expanded" },
            { value: "compact", label: "Compact" },
          ]), true),
          row("Compact layout", "Reduce shell spacing and control heights.", switchControl("compact-layout", settings.compactLayout), true),
          row("New tab density", "Adjust bookmark spacing on the New Tab page.", selectControl("newtab-density", settings.newTabDensity, [
            { value: "comfortable", label: "Comfortable" },
            { value: "compact", label: "Compact" },
          ]), true),
        ]);
      }

      function renderPrivacy() {
        return `
          ${panel([
            row("HTTPS-first navigation", "Bare domains open with https:// when enabled.", switchControl("https-first", settings.httpsFirst), true),
            row("Clear browsing data", "Clears saved browsing history.", `<button id="clear-history" class="inline-button" type="button">Clear history</button>`),
            row("Site permissions", "Saved allow/deny decisions for camera, microphone, location and notifications.", `<button id="clear-permissions" class="inline-button" type="button">Reset permissions</button>`),
            row("Site data", "Cookies and local storage saved by visited sites.", `<button id="manage-site-data" class="inline-button" type="button">Manage site data</button>`),
          ])}
          <div class="saved-passwords-panel" aria-label="Saved passwords">
            ${renderSavedPasswords()}
          </div>
          <div class="site-data-panel" aria-label="Site data">
            ${renderSiteData()}
          </div>
          <div class="permissions-panel" aria-label="Site permissions">
            ${renderPermissions()}
          </div>
          <div class="status-panel" aria-label="Security status">
            ${statusItem("External links", "Remote pages can only hand off mailto: and tel: protocols externally.", "Restricted")}
            ${statusItem("Permissions", "Unknown site permission requests show a Nyra prompt and saved decisions apply per site.", "Prompt per site")}
            ${statusItem("Remote page isolation", "Remote pages run in isolated webviews; Nyra preload is only attached to trusted local pages.", "Enabled")}
          </div>
        `;
      }

      function renderPermissions() {
        const domainFilter = localStorage.getItem("nyra-settings-domain") || "";
        const visiblePermissions = domainFilter
          ? permissions.filter((permission) => permission.domain === domainFilter)
          : permissions;

        if (!visiblePermissions.length) {
          return `<p class="empty-status">No saved site permissions.</p>`;
        }

        return visiblePermissions.map((permission) => `
          <div class="permission-row">
            <span>
              <strong>${escapeHtml(permission.domain)}</strong>
              <small>${escapeHtml(permission.permission)}</small>
            </span>
            <select data-permission-domain="${escapeHtml(permission.domain)}" data-permission-type="${escapeHtml(permission.permission)}">
              <option value="allow" ${permission.value === "allow" ? "selected" : ""}>Allow</option>
              <option value="deny" ${permission.value === "deny" ? "selected" : ""}>Deny</option>
            </select>
            <button class="inline-button remove-permission" type="button" data-permission-domain="${escapeHtml(permission.domain)}" data-permission-type="${escapeHtml(permission.permission)}">Remove</button>
          </div>
        `).join("");
      }

      function formatDate(value) {
        if (!value) return "Unknown";
        try {
          return new Date(value).toLocaleDateString();
        } catch {
          return "Unknown";
        }
      }

      function filteredSavedLogins() {
        const query = passwordSearch.trim().toLowerCase();
        const logins = Array.isArray(savedLoginsInfo.logins) ? savedLoginsInfo.logins : [];
        if (!query) return logins;

        return logins.filter((login) => (
          String(login.origin || "").toLowerCase().includes(query) ||
          String(login.domain || "").toLowerCase().includes(query) ||
          String(login.username || "").toLowerCase().includes(query)
        ));
      }

      function renderSavedPasswords() {
        if (!savedLoginsInfo.available) {
          return `
            <div class="saved-passwords-header">
              <strong>Saved passwords</strong>
              ${badge("Encryption unavailable")}
            </div>
            <p class="empty-status">Nyra cannot access encrypted passwords because OS encryption is unavailable.</p>
          `;
        }

        const logins = filteredSavedLogins();
        return `
          <div class="saved-passwords-header">
            <strong>Saved passwords</strong>
            <input id="password-search" type="search" value="${escapeHtml(passwordSearch)}" placeholder="Search passwords" />
            <button id="clear-saved-logins" class="inline-button" type="button" ${savedLoginsInfo.logins.length ? "" : "disabled"}>Clear all</button>
          </div>
          ${savedLoginsInfo.recovery ? `<p class="empty-status">Password store was recovered from a corrupted file.</p>` : ""}
          ${logins.length ? logins.map((login) => {
            const revealed = revealedPasswords.get(login.id);
            return `
              <div class="saved-password-row">
                <span>
                  <strong>${escapeHtml(login.domain || login.origin)}</strong>
                  <small>${escapeHtml(login.origin)}</small>
                </span>
                <span>
                  <strong>${escapeHtml(login.username)}</strong>
                  <small>Created ${formatDate(login.createdAt)} · Updated ${formatDate(login.updatedAt)}</small>
                  ${revealed ? `<code>${escapeHtml(revealed)}</code>` : ""}
                </span>
                <div class="saved-password-actions">
                  <button class="inline-button reveal-login" type="button" data-login-id="${escapeHtml(login.id)}">${revealed ? "Hide" : pendingRevealId === login.id ? "Confirm reveal" : "Reveal"}</button>
                  <button class="inline-button copy-username" type="button" data-login-id="${escapeHtml(login.id)}">Copy username</button>
                  <button class="inline-button copy-password" type="button" data-login-id="${escapeHtml(login.id)}">Copy password</button>
                  <button class="inline-button delete-login" type="button" data-login-id="${escapeHtml(login.id)}">Delete</button>
                </div>
              </div>
            `;
          }).join("") : `<p class="empty-status">No saved passwords.</p>`}
        `;
      }

      function renderSiteData() {
        if (!siteData.length) {
          return `<p class="empty-status">No saved site data.</p>`;
        }

        return siteData.map((item) => `
          <div class="site-data-row">
            <span>
              <strong>${escapeHtml(item.domain)}</strong>
              <small>${Number(item.cookies || 0)} cookie${Number(item.cookies || 0) === 1 ? "" : "s"}</small>
            </span>
            <button class="inline-button clear-site-data-domain" type="button" data-site-domain="${escapeHtml(item.domain)}">Clear</button>
          </div>
        `).join("");
      }

      function renderSearch() {
        return panel([
          row("Default search engine", "Used by address bar and New Tab search.", selectControl("search-engine", settings.searchEngine, searchEngineOptions()), true),
        ]);
      }

      function renderTabs() {
        return panel([
          row("Restore previous session", "Reopen saved tabs the next time Nyra starts.", switchControl("restore-session", settings.startupBehavior === "restore"), true),
          row("Compact tabs", "Reduce tab width and horizontal padding.", switchControl("compact-tabs", settings.compactTabs), true),
          row("Close button", "Choose whether tab close buttons are always visible or only on hover.", selectControl("tab-close-mode", settings.tabCloseButtonMode, [
            { value: "always", label: "Always visible" },
            { value: "hover", label: "On hover" },
          ]), true),
        ]);
      }

      function renderDownloads() {
        const folder = downloadsInfo?.folder || settings.downloadPath || downloadsInfo?.defaultFolder || "";
        return panel([
          row("Download location", "Used for downloads when save prompts are disabled.", `
            <div class="path-control">
              <code class="path-value">${escapeHtml(folder)}</code>
              <button id="change-download-folder" class="inline-button" type="button">Change</button>
            </div>
          `),
          row("Ask where to save", "Show a save dialog before each download.", switchControl("ask-download-location", settings.askDownloadLocation), true),
          row("Downloads folder", "Open the current download folder.", `<button id="open-downloads-folder" class="inline-button" type="button">Open folder</button>`),
        ]);
      }

      function renderShortcuts() {
        const shortcuts = [
          ["Ctrl+L", "Focus address bar"],
          ["Ctrl+T", "New tab"],
          ["Ctrl+W", "Close active tab"],
          ["Ctrl+R", "Reload active tab"],
          ["Alt+Left", "Go back"],
          ["Alt+Right", "Go forward"],
          ["Ctrl+Shift+T", "Reopen closed tab"],
          ["Ctrl+K", "Open command palette"],
          ["Ctrl++", "Zoom in"],
          ["Ctrl+-", "Zoom out"],
          ["Ctrl+0", "Reset zoom"],
          ["Ctrl+Shift+I", "Toggle active webview DevTools"],
          ["F12", "Toggle active webview DevTools"],
        ];

        return `<div class="settings-panel shortcut-panel">${shortcuts.map(([keys, action]) => `
          <div class="shortcut-row">
            <kbd>${keys}</kbd>
            <span>${action}</span>
          </div>
        `).join("")}</div>`;
      }

      function renderAbout() {
        const info = appInfo || {};
        const repository = info.repository || info.homepage || "";
        const updater = updateInfo || {};
        const updateDescription = updater.message
          || (updater.status === "downloaded"
            ? "Update downloaded. Restart Nyra to install."
            : updater.status === "downloading"
              ? `Downloading update${Number.isFinite(updater.percent) ? ` (${Math.round(updater.percent)}%)` : ""}.`
              : updater.status === "available"
                ? updater.manualOnly
                  ? `Version ${escapeHtml(updater.latestVersion || "newer")} is available.`
                  : "Update available."
                : updater.status === "not-available"
                  ? `Nyra is up to date at ${escapeHtml(updater.currentVersion || info.version || "this version")}.`
                  : updater.status === "error"
                    ? `Update check failed: ${escapeHtml(updater.error || "Unknown error")}`
                    : updater.manualOnly
                      ? "Development builds can check releases but cannot install updates."
                      : "Check GitHub releases for a newer Nyra build.");
        const updateControls = [
          `<button id="check-updates" class="inline-button" type="button"${updater.status === "checking" || updater.status === "downloading" ? " disabled" : ""}>${
            updater.status === "downloading" ? "Downloading..." : "Check for updates"
          }</button>`,
          updater.canInstall ? `<button id="install-update" class="inline-button primary" type="button">Install and restart</button>` : "",
          updater.releaseUrl ? `<button id="open-latest-release" class="inline-button" type="button">Open release</button>` : "",
        ].filter(Boolean).join("");
        return panel([
          row("Name", "Application name.", badge(escapeHtml(info.name || "Nyra"))),
          row("Version", "Package version.", badge(escapeHtml(info.version || "Unavailable"))),
          row("Electron", "Runtime version.", badge(escapeHtml(info.electron || "Unavailable"))),
          row("Chromium", "Embedded browser engine.", badge(escapeHtml(info.chromium || "Unavailable"))),
          row("Node", "Main process runtime.", badge(escapeHtml(info.node || "Unavailable"))),
          row("License", "Project license.", badge(escapeHtml(info.license || "Not specified"))),
          row("Updates", updateDescription, `<span class="button-group">${updateControls}</span>`),
          row("Repository", repository ? escapeHtml(repository) : "Repository not configured.", repository ? `<button id="open-repository" class="inline-button" type="button">Open repository</button>` : badge("Unavailable")),
        ]);
      }

      function accentOptions() {
        return Object.entries(window.NyraSettings.ACCENTS).map(([value, accent]) => ({
          value,
          label: accent.name,
        }));
      }

      function searchEngineOptions() {
        return Object.entries(window.NyraSettings.SEARCH_ENGINES).map(([value, engine]) => ({
          value,
          label: engine.name,
        }));
      }

      function statusItem(title, description, value) {
        return `
          <div class="security-status">
            <span>
              <strong>${title}</strong>
              <small>${description}</small>
            </span>
            ${badge(value)}
          </div>
        `;
      }

      function bindSectionControls() {
        bindChange("https-first", "checked", (value) => saveSettings({ httpsFirst: value }));
        bindChange("search-engine", "value", (value) => saveSettings({ searchEngine: value }));
        bindChange("startup-behavior", "value", (value) => saveSettings({ startupBehavior: value, restoreSession: value === "restore" }));
        bindChange("newtab-page", "value", (value) => saveSettings({ newTabPage: value }));
        bindChange("restore-session", "checked", (value) => saveSettings({ startupBehavior: value ? "restore" : "newtab", restoreSession: value }));
        bindChange("theme", "value", (value) => saveSettings({ theme: value }));
        bindChange("accent-color", "value", (value) => saveSettings({ accentColor: value }));
        bindChange("sidebar-mode", "value", (value) => saveSettings({ sidebarMode: value, showSidebar: value === "expanded" }));
        bindChange("compact-layout", "checked", (value) => saveSettings({ compactLayout: value }));
        bindChange("newtab-density", "value", (value) => saveSettings({ newTabDensity: value }));
        bindChange("compact-tabs", "checked", (value) => saveSettings({ compactTabs: value }));
        bindChange("tab-close-mode", "value", (value) => saveSettings({ tabCloseButtonMode: value }));
        bindChange("ask-download-location", "checked", (value) => saveSettings({ askDownloadLocation: value }));
        bindChange("hardware-acceleration", "checked", (value) => saveSettings({ hardwareAcceleration: value }));

        document.getElementById("zoom-out")?.addEventListener("click", () => {
          saveSettings({ defaultZoom: Math.max(0.75, settings.defaultZoom - 0.05) });
        });
        document.getElementById("zoom-in")?.addEventListener("click", () => {
          saveSettings({ defaultZoom: Math.min(1.5, settings.defaultZoom + 0.05) });
        });
        document.getElementById("reset-state")?.addEventListener("click", async () => {
          const state = await window.nyra.resetState();
          mergeSettings(state.settings);
          downloadsInfo = await window.nyra.getDownloadsInfo();
          renderSection(activeSection);
          setStatus("Settings and saved state reset.");
        });
        document.getElementById("clear-history")?.addEventListener("click", async () => {
          await window.nyra.clearHistory();
          setStatus("Browsing history cleared.");
        });
        document.getElementById("clear-permissions")?.addEventListener("click", async () => {
          permissions = await window.nyra.clearPermissions();
          renderSection(activeSection);
          setStatus("Site permissions reset.");
        });
        document.getElementById("manage-site-data")?.addEventListener("click", () => {
          window.location.href = "./site-data.html";
        });
        document.getElementById("open-latest-release")?.addEventListener("click", async () => {
          const result = updateInfo?.releaseUrl
            ? await window.nyra.openTrustedExternalUrl(updateInfo.releaseUrl)
            : { ok: false };
          setStatus(result.ok ? "Release page opened." : "Release link blocked.");
        });
        document.querySelectorAll(".clear-site-data-domain").forEach((button) => {
          button.addEventListener("click", async () => {
            siteData = await window.nyra.clearSiteData(button.dataset.siteDomain);
            renderSection(activeSection);
            setStatus("Site data cleared.");
          });
        });
        document.getElementById("password-search")?.addEventListener("input", (event) => {
          passwordSearch = event.target.value;
          renderSection(activeSection);
        });
        document.getElementById("clear-saved-logins")?.addEventListener("click", async () => {
          savedLoginsInfo = await window.nyra.clearSavedLogins();
          revealedPasswords.clear();
          pendingRevealId = "";
          renderSection(activeSection);
          setStatus("Saved passwords cleared.");
        });
        document.querySelectorAll(".copy-username").forEach((button) => {
          button.addEventListener("click", async () => {
            const login = savedLoginsInfo.logins.find((item) => item.id === button.dataset.loginId);
            if (!login) return;
            await navigator.clipboard.writeText(login.username);
            setStatus("Username copied.");
          });
        });
        document.querySelectorAll(".copy-password").forEach((button) => {
          button.addEventListener("click", async () => {
            const result = await window.nyra.getLoginSecret(button.dataset.loginId);
            if (!result.ok || !result.credential) {
              setStatus("Password could not be decrypted.");
              return;
            }
            await navigator.clipboard.writeText(result.credential.password);
            setStatus("Password copied.");
          });
        });
        document.querySelectorAll(".reveal-login").forEach((button) => {
          button.addEventListener("click", async () => {
            const id = button.dataset.loginId;
            if (revealedPasswords.has(id)) {
              revealedPasswords.delete(id);
              pendingRevealId = "";
              renderSection(activeSection);
              return;
            }
            if (pendingRevealId !== id) {
              pendingRevealId = id;
              renderSection(activeSection);
              setStatus("Click Confirm reveal to show this password temporarily.");
              return;
            }

            const result = await window.nyra.getLoginSecret(id);
            if (!result.ok || !result.credential) {
              pendingRevealId = "";
              setStatus("Password could not be decrypted.");
              renderSection(activeSection);
              return;
            }
            revealedPasswords.set(id, result.credential.password);
            pendingRevealId = "";
            renderSection(activeSection);
            setStatus("Password revealed temporarily.");
            window.setTimeout(() => {
              revealedPasswords.delete(id);
              if (activeSection === "privacy") renderSection(activeSection);
            }, 30000);
          });
        });
        document.querySelectorAll(".delete-login").forEach((button) => {
          button.addEventListener("click", async () => {
            savedLoginsInfo = await window.nyra.deleteSavedLogin(button.dataset.loginId);
            revealedPasswords.delete(button.dataset.loginId);
            renderSection(activeSection);
            setStatus("Saved login deleted.");
          });
        });
        document.querySelectorAll("[data-permission-domain][data-permission-type]").forEach((control) => {
          if (control.classList.contains("remove-permission")) {
            control.addEventListener("click", async () => {
              permissions = await window.nyra.removePermission(control.dataset.permissionDomain, control.dataset.permissionType);
              renderSection(activeSection);
              setStatus("Site permission removed.");
            });
            return;
          }

          control.addEventListener("change", async () => {
            permissions = await window.nyra.setPermission({
              domain: control.dataset.permissionDomain,
              permission: control.dataset.permissionType,
              value: control.value,
            });
            renderSection(activeSection);
            setStatus("Site permission updated.");
          });
        });
        document.getElementById("open-default-apps")?.addEventListener("click", async () => {
          const result = await window.nyra.openDefaultAppsSettings();
          setStatus(result.ok ? "Default apps settings opened." : "Default-app settings are only available on Windows.");
        });
        document.getElementById("change-download-folder")?.addEventListener("click", async () => {
          mergeSettings(await window.nyra.chooseDownloadFolder());
          downloadsInfo = await window.nyra.getDownloadsInfo();
          renderSection(activeSection);
          setStatus("Download location updated.");
        });
        document.getElementById("open-downloads-folder")?.addEventListener("click", async () => {
          const result = await window.nyra.openDownloadsFolder();
          setStatus(result.ok ? "Downloads folder opened." : "Could not open downloads folder.");
        });
        document.getElementById("open-repository")?.addEventListener("click", async () => {
          const repository = appInfo?.repository || appInfo?.homepage;
          const result = repository ? await window.nyra.openTrustedExternalUrl(repository) : { ok: false };
          setStatus(result.ok ? "Repository opened." : "Repository link blocked.");
        });
        document.getElementById("check-updates")?.addEventListener("click", async () => {
          updateInfo = await window.nyra.checkForUpdates();
          renderSection(activeSection);
          setStatus(updateInfo.message || (updateInfo.ok
            ? updateInfo.isNewer
              ? `Nyra ${updateInfo.latestVersion} is available.`
              : "Nyra is up to date."
            : `Update check failed: ${updateInfo.error || "Unknown error"}`));
        });
        document.getElementById("install-update")?.addEventListener("click", async () => {
          const result = await window.nyra.installDownloadedUpdate();
          setStatus(result.ok ? "Restarting Nyra to install the update..." : `Install failed: ${result.error || "No update ready."}`);
        });
      }

      function bindChange(id, property, handler) {
        const input = document.getElementById(id);
        if (!input) return;
        input.addEventListener("change", () => handler(input[property]));
      }

      function renderSection(section) {
        activeSection = section;
        const [title, description] = SECTION_COPY[section] || SECTION_COPY.general;
        sectionTitle.textContent = title;
        sectionDescription.textContent = description;

        navItems.forEach((item) => {
          item.classList.toggle("active", item.dataset.section === section);
        });

        const renderers = {
          general: renderGeneral,
          appearance: renderAppearance,
          privacy: renderPrivacy,
          search: renderSearch,
          tabs: renderTabs,
          downloads: renderDownloads,
          shortcuts: renderShortcuts,
          about: renderAbout,
        };

        settingsContent.innerHTML = (renderers[section] || renderers.general)();
        bindSectionControls();
      }

      async function init() {
        if (!window.nyra) {
          setStatus("Settings API unavailable.");
          return;
        }

        const [loadedSettings, loadedAppInfo, loadedDownloadsInfo, loadedPermissions, loadedSiteData, loadedSavedLogins, loadedUpdateInfo] = await Promise.all([
          window.nyra.getSettings(),
          window.nyra.getAppInfo(),
          window.nyra.getDownloadsInfo(),
          window.nyra.getPermissions(),
          window.nyra.getSiteData(),
          window.nyra.getSavedLogins(),
          window.nyra.getUpdateState(),
        ]);

        appInfo = loadedAppInfo;
        downloadsInfo = loadedDownloadsInfo;
        permissions = loadedPermissions;
        siteData = Array.isArray(loadedSiteData) ? loadedSiteData : [];
        savedLoginsInfo = loadedSavedLogins || { available: false, logins: [] };
        updateInfo = loadedUpdateInfo || null;
        mergeSettings(loadedSettings);
        renderSection(activeSection);
        setStatus("Settings loaded.");

        window.nyra.onSettingsChanged((nextSettings) => {
          mergeSettings(nextSettings);
          renderSection(activeSection);
        });
        window.nyra.onPermissionsChanged((nextPermissions) => {
          permissions = Array.isArray(nextPermissions) ? nextPermissions : [];
          if (activeSection === "privacy") renderSection(activeSection);
        });
        window.nyra.onUpdateState((nextUpdateInfo) => {
          updateInfo = nextUpdateInfo || null;
          if (activeSection === "about") renderSection(activeSection);
          if (updateInfo?.message) setStatus(updateInfo.message);
        });

        navItems.forEach((item) => {
          item.addEventListener("click", () => {
            localStorage.setItem("nyra-settings-section", item.dataset.section);
            renderSection(item.dataset.section);
            setStatus("");
          });
        });
      }

      init();
    </script>
  </body>
</html>
