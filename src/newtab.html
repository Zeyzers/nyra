<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab - Nyra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/NyraLogo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="newtab-shell">
      <header class="hero">
        <div class="hero-brand">
          <img class="hero-mark" src="assets/NyraLogo.svg" alt="" />
          <h1>Nyra</h1>
        </div>
        <div id="space-badge" class="space-badge" hidden></div>
        <div class="search-bar">
          <input
            type="text"
            id="newtab-search"
            placeholder="Search the web privately"
          />
          <button id="newtab-submit" type="button" aria-label="Search"><span data-icon="arrow-right"></span></button>
        </div>
      </header>

      <section class="bookmarks" aria-labelledby="bookmarks-title">
        <div class="section-heading">
          <h2 id="bookmarks-title">Bookmarks</h2>
          <button id="manage-bookmarks" type="button">Manage bookmarks</button>
        </div>
        <div id="bookmarks-list" class="bookmarks-list"></div>
      </section>

      <div class="activity-grid">
        <section id="continue-section" class="activity-section" aria-labelledby="continue-title" hidden>
          <div class="section-heading">
            <h2 id="continue-title">Continue where you left off</h2>
          </div>
          <div id="continue-list" class="activity-list"></div>
        </section>
        <section id="recent-section" class="activity-section" aria-labelledby="recent-title" hidden>
          <div class="section-heading">
            <h2 id="recent-title">Recently visited</h2>
            <button id="open-history" type="button">View history</button>
          </div>
          <div id="recent-list" class="activity-list"></div>
        </section>
      </div>
    </main>

    <dialog id="bookmark-dialog" class="bookmark-dialog">
      <form method="dialog" id="bookmark-form">
        <header>
          <strong>Add bookmark</strong>
          <button id="bookmark-dialog-close" type="button" aria-label="Close"><span data-icon="close"></span></button>
        </header>
        <label>
          Name
          <input id="bookmark-name" type="text" autocomplete="off" required />
        </label>
        <label>
          URL
          <input id="bookmark-url" type="url" autocomplete="off" required placeholder="https://example.com" />
        </label>
        <p id="bookmark-error" role="status"></p>
        <div class="dialog-actions">
          <button id="bookmark-cancel" type="button">Cancel</button>
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script src="url-utils.js"></script>
    <script src="settings-utils.js"></script>
    <script src="icons.js"></script>
    <script>
      window.NyraIcons?.mount(document);
      const input = document.getElementById("newtab-search");
      const submit = document.getElementById("newtab-submit");
      const bookmarksList = document.getElementById("bookmarks-list");
      const spaceBadge = document.getElementById("space-badge");
      const manageBookmarks = document.getElementById("manage-bookmarks");
      const bookmarkDialog = document.getElementById("bookmark-dialog");
      const bookmarkForm = document.getElementById("bookmark-form");
      const bookmarkName = document.getElementById("bookmark-name");
      const bookmarkUrl = document.getElementById("bookmark-url");
      const bookmarkError = document.getElementById("bookmark-error");
      const bookmarkCancel = document.getElementById("bookmark-cancel");
      const bookmarkDialogClose = document.getElementById("bookmark-dialog-close");
      const continueSection = document.getElementById("continue-section");
      const continueList = document.getElementById("continue-list");
      const recentSection = document.getElementById("recent-section");
      const recentList = document.getElementById("recent-list");
      const openHistory = document.getElementById("open-history");
      let settings = window.NyraSettings
        ? window.NyraSettings.DEFAULT_SETTINGS
        : { httpsFirst: true, searchEngine: "duckduckgo", restoreSession: true };

      function renderSpaceBadge() {
        if (!spaceBadge) return;
        const params = new URLSearchParams(window.location.search);
        const name = params.get("space") || "Personal";
        const color = params.get("spaceColor") || "#4f8cff";
        spaceBadge.textContent = `${name} Space`;
        spaceBadge.style.setProperty("--space-color", color);
        spaceBadge.hidden = false;
      }

      function applySettings(nextSettings) {
        settings = window.NyraSettings
          ? window.NyraSettings.normalizeSettings(nextSettings)
          : { ...settings, ...nextSettings };

        if (window.NyraSettings) {
          window.NyraSettings.applyAppearance(settings);
        }
      }

      if (window.nyra) {
        window.nyra.getSettings().then((nextSettings) => {
          applySettings(nextSettings);
        });

        window.nyra.getBookmarks().then(renderBookmarks);

        window.nyra.onSettingsChanged((nextSettings) => {
          applySettings(nextSettings);
        });

        window.nyra.onBookmarksChanged(renderBookmarks);
      }

      function renderBookmarks(bookmarks = []) {
        bookmarksList.innerHTML = "";

        bookmarks.forEach((bookmark) => {
          const link = document.createElement("a");
          link.href = bookmark.url;
          link.title = bookmark.url;
          const icon = document.createElement("span");
          icon.className = "bookmark-icon";
          icon.textContent = (bookmark.title || bookmark.url).trim().charAt(0).toUpperCase();
          const label = document.createElement("span");
          label.className = "bookmark-label";
          label.textContent = bookmark.title || bookmark.url;
          link.append(icon, label);
          bookmarksList.appendChild(link);
        });

        const addBookmark = document.createElement("button");
        addBookmark.className = "add-bookmark";
        addBookmark.type = "button";
        addBookmark.innerHTML = '<span class="bookmark-icon" data-icon="plus"></span><span class="bookmark-label">Add bookmark</span>';
        window.NyraIcons?.mount(addBookmark);
        addBookmark.addEventListener("click", openAddBookmarkDialog);
        bookmarksList.appendChild(addBookmark);
      }

      function isRemoteUrl(value) {
        try {
          const protocol = new URL(value).protocol;
          return protocol === "http:" || protocol === "https:";
        } catch {
          return false;
        }
      }

      function siteLabel(value) {
        try {
          return new URL(value).hostname.replace(/^www\./, "");
        } catch {
          return value;
        }
      }

      function activityLink(item) {
        const link = document.createElement("a");
        link.className = "activity-card";
        link.href = item.url;
        link.title = item.url;

        const icon = document.createElement("span");
        icon.className = "activity-icon";
        const image = document.createElement("img");
        try {
          image.src = item.favicon || `${new URL(item.url).origin}/favicon.ico`;
        } catch {
          image.src = "";
        }
        image.alt = "";
        image.addEventListener("error", () => {
          icon.textContent = (item.title || siteLabel(item.url)).trim().charAt(0).toUpperCase();
        });
        icon.appendChild(image);

        const copy = document.createElement("span");
        copy.className = "activity-copy";
        const title = document.createElement("strong");
        title.textContent = item.title || siteLabel(item.url);
        const meta = document.createElement("small");
        meta.textContent = siteLabel(item.url);
        copy.append(title, meta);

        link.append(icon, copy);
        return link;
      }

      function renderActivity(history = [], session = {}) {
        const params = new URLSearchParams(window.location.search);
        const spaceId = params.get("spaceId") || "personal";
        const continueItems = (Array.isArray(session.tabs) ? session.tabs : [])
          .filter((tab) => tab.spaceId === spaceId && isRemoteUrl(tab.url))
          .slice(0, 3);
        const continueUrls = new Set(continueItems.map((item) => item.url));
        const recentOrigins = new Set();
        const recentItems = (Array.isArray(history) ? history : []).filter((entry) => {
          if (!isRemoteUrl(entry.url) || continueUrls.has(entry.url)) return false;
          const origin = new URL(entry.url).origin;
          if (recentOrigins.has(origin)) return false;
          recentOrigins.add(origin);
          return true;
        }).slice(0, 4);

        continueList.innerHTML = "";
        continueItems.forEach((item) => continueList.appendChild(activityLink(item)));
        continueSection.hidden = continueItems.length === 0;

        recentList.innerHTML = "";
        recentItems.forEach((item) => recentList.appendChild(activityLink(item)));
        recentSection.hidden = recentItems.length === 0;
      }

      function normalizedBookmarkUrl(value) {
        const normalized = window.NyraUrl.normalizeUrlInput(value, {
          httpsFirst: settings.httpsFirst,
          searchEngine: settings.searchEngine,
        });

        try {
          const parsed = new URL(normalized);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch {
          return "";
        }
      }

      function openAddBookmarkDialog() {
        if (!window.nyra) return;

        bookmarkForm.reset();
        bookmarkError.textContent = "";
        bookmarkDialog.showModal();
        bookmarkName.focus();
      }

      function closeBookmarkDialog() {
        bookmarkDialog.close();
      }

      renderSpaceBadge();
      renderBookmarks();

      function submitSearch() {
        const query = window.NyraUrl.normalizeUrlInput(input.value, {
          httpsFirst: settings.httpsFirst,
          searchEngine: settings.searchEngine,
        });
        if (query) window.location.href = query;
      }

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitSearch();
      });
      submit.addEventListener("click", submitSearch);
      manageBookmarks.addEventListener("click", () => {
        window.location.href = "./bookmarks.html";
      });
      openHistory.addEventListener("click", () => {
        window.location.href = "./history.html";
      });
      bookmarkCancel.addEventListener("click", closeBookmarkDialog);
      bookmarkDialogClose.addEventListener("click", closeBookmarkDialog);
      bookmarkForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = normalizedBookmarkUrl(bookmarkUrl.value);
        const title = bookmarkName.value.trim();

        if (!title || !url) {
          bookmarkError.textContent = "Enter a name and a valid http or https URL.";
          return;
        }

        const nextBookmarks = await window.nyra.addBookmark({ title, url });
        renderBookmarks(nextBookmarks);
        closeBookmarkDialog();
      });

      if (window.nyra) {
        Promise.all([window.nyra.getHistory(), window.nyra.loadSession()])
          .then(([history, session]) => renderActivity(history, session))
          .catch(() => renderActivity());
        window.nyra.onHistoryChanged((history) => {
          window.nyra.loadSession().then((session) => renderActivity(history, session));
        });
      }
    </script>

  </body>
</html>
